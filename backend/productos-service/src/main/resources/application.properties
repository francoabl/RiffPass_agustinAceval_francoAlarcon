spring.application.name=productos-service
server.port=${PORT:8082}

# --- Base de datos cloud (AWS RDS MySQL). Configurar por variables de entorno ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pedidos360_productos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Amazon Cognito (validacion del JWT) ---
cognito.region=${COGNITO_REGION:us-east-1}
cognito.user-pool-id=${COGNITO_USER_POOL_ID:us-east-1_XXXXXXXXX}
cognito.app-client-id=${COGNITO_APP_CLIENT_ID:changeme}

# --- CORS (origen del frontend React) ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health
