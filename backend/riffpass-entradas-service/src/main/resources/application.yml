server:
  port: ${PORT:8082}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: riffpass-entradas-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
riffpass:
  security:
    issuer: ${COGNITO_ISSUER}
    client-id: ${COGNITO_CLIENT_ID}
    audience: ${COGNITO_AUDIENCE:}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  eventos-url: ${EVENTOS_BASE_URL:http://localhost:8081}
